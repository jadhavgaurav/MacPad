included:
  - Sources
  - Tests
excluded:
  - .build
  - build
line_length:
  warning: 140
  error: 200
  ignores_comments: true
file_length:
  warning: 500
  error: 800
function_body_length:
  warning: 60
  error: 120
type_body_length:
  warning: 400
  error: 700
identifier_name:
  min_length: 1
  excluded: [id, ns, to, x, y, lm, tv]
disabled_rules:
  - trailing_comma
  - todo
  - nesting
  - cyclomatic_complexity
  - function_parameter_count
